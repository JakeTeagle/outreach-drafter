<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outreach Drafter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="top">
      <div>
        <h1 class="large-title">Outreach</h1>
        <div class="subtitle">Tailored InMails from your playbooks</div>
      </div>
      <button class="icon-button" id="open-settings" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="setup-warning" class="banner" hidden>
      <div class="symbol orange">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>
      </div>
      <div>
        <strong>Finish setting up</strong>
        <p>Add your Notion and Anthropic keys in <button class="link-button" id="open-settings-2">Settings</button>.</p>
      </div>
    </div>

    <div class="section-header">Role</div>
    <div class="group">
      <div class="row">
        <div class="symbol blue">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        </div>
        <span class="row-label">Playbook</span>
        <div class="select-wrap">
          <select id="playbook" aria-label="Hiring playbook"><option value="">Loading…</option></select>
        </div>
      </div>
      <div class="row">
        <div class="symbol gray">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </div>
        <button class="link-button" id="refresh-playbooks">Refresh from Notion</button>
      </div>
    </div>

    <div class="section-header">Notes</div>
    <div class="group">
      <div class="row">
        <textarea id="notes" rows="3" aria-label="Extra notes" placeholder="Anything to weave in, e.g. referred by a colleague, hybrid in London"></textarea>
      </div>
    </div>
    <div class="section-footer">Optional. Shapes the draft but is never quoted verbatim.</div>

    <button id="draft" class="button filled">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 2.5l1.6 4.9a2 2 0 0 0 1.3 1.3L17.8 10.3l-4.9 1.6a2 2 0 0 0-1.3 1.3L10 18.1l-1.6-4.9a2 2 0 0 0-1.3-1.3L2.2 10.3l4.9-1.6a2 2 0 0 0 1.3-1.3zM18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
      Scan Profile &amp; Draft
    </button>
    <div id="status" class="status" role="status"></div>

    <section id="results" hidden>
      <div class="section-header">Candidate</div>
      <div class="group" id="candidate"></div>

      <div class="section-header">Draft</div>
      <div class="segmented" id="segmented" role="tablist"></div>
      <div class="group" id="draft-card"></div>
      <div class="actions">
        <button class="button tinted" id="copy-body">Copy Message</button>
        <button class="button tinted" id="copy-subject">Copy Subject</button>
      </div>

      <div id="meta"></div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
